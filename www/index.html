/* Layout: KAM command console — left rail on laptop, bottom dock on phone; dense tables, numbers in mono. Midnight Luxe, dark first. */
:root {

  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --glow1: rgba(60,203,255,.10); --glow2: rgba(143,124,255,.09); --hero: linear-gradient(135deg, #0F1D3E 0%, #0B1427 55%, #1A1640 100%); --tile-hi: rgba(255,255,255,.035);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F3F5FA; --panel: #FFFFFF; --panel2: #EDF1F8; --line: #D8DFEC; --fg: #0E1526; --muted: #5A6683;
  --accent: #0B78A8; --violet: #6352CF; --good: #178A5C; --warn: #A86E12; --bad: #C93A52;
  --accent-soft: rgba(11,120,168,.09); --good-soft: rgba(23,138,92,.1); --warn-soft: rgba(168,110,18,.11); --bad-soft: rgba(201,58,82,.1); --violet-soft: rgba(99,82,207,.1);
  --c-rev: #178A5C; --c-pro: #6352CF; --c-hyg: #0B78A8; --c-nrv: #A86E12; --c-nkr: #7A86A3; --amber: #C77A0A;
  --edge: #D8DFEC; --edge-hi: #9CC9E2; --panel-grad: linear-gradient(160deg, rgba(11,120,168,.04), rgba(255,255,255,0) 45%);
  --shadow: 0 1px 2px rgba(14,21,38,.06), 0 6px 18px rgba(14,21,38,.06); --glow1: rgba(11,120,168,.07); --glow2: rgba(99,82,207,.06); --hero: linear-gradient(135deg, #FFFFFF 0%, #EEF4FF 60%, #F1EEFF 100%); --tile-hi: rgba(255,255,255,.7); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #F3F5FA; --panel: #FFFFFF; --panel2: #EDF1F8; --line: #D8DFEC; --fg: #0E1526; --muted: #5A6683;
  --accent: #0B78A8; --violet: #6352CF; --good: #178A5C; --warn: #A86E12; --bad: #C93A52;
  --accent-soft: rgba(11,120,168,.09); --good-soft: rgba(23,138,92,.1); --warn-soft: rgba(168,110,18,.11); --bad-soft: rgba(201,58,82,.1); --violet-soft: rgba(99,82,207,.1);
  --c-rev: #178A5C; --c-pro: #6352CF; --c-hyg: #0B78A8; --c-nrv: #A86E12; --c-nkr: #7A86A3; --amber: #C77A0A;
  --edge: #D8DFEC; --edge-hi: #9CC9E2; --panel-grad: linear-gradient(160deg, rgba(11,120,168,.04), rgba(255,255,255,0) 45%);
  --shadow: 0 1px 2px rgba(14,21,38,.06), 0 6px 18px rgba(14,21,38,.06); --glow1: rgba(11,120,168,.07); --glow2: rgba(99,82,207,.06); --hero: linear-gradient(135deg, #FFFFFF 0%, #EEF4FF 60%, #F1EEFF 100%); --tile-hi: rgba(255,255,255,.7); color-scheme: light; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--f-body); font-feature-settings: "tnum" 1, "cv11" 1; -webkit-font-smoothing: antialiased; background-image: radial-gradient(900px 420px at 85% -10%, var(--glow2), transparent 60%), radial-gradient(800px 380px at 10% -15%, var(--glow1), transparent 60%); background-attachment: fixed; }

button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.num, td.n { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 600; font-size: .95rem; letter-spacing: 0; }
.mono { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 500; }

.eyebrow { font-size: .74rem; letter-spacing: .1em; text-transform: none; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); padding: 22px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }

.brand b { font: 700 1.05rem var(--f-display); letter-spacing: .18em; }
.nav-btn { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; border: 0; background: none; cursor: pointer; text-align: left; color: var(--muted); font-weight: 500; }

.nav-sep { height: 1px; background: var(--line); margin: 10px 8px; }

.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.topbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 11px; font-weight: 600; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--violet)); border-color: transparent; color: #0B1020; font-weight: 700; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.star.on { color: var(--warn); }
.vs { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 10px; align-items: end; }
.vs .mid { font: 700 .8rem var(--f-display); color: var(--muted); padding-bottom: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

.chip:hover { color: var(--fg); border-color: var(--accent); }
.delta { font-weight: 600; font-family: var(--f-num); }

.sec-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

.wins { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.wins li { padding: 8px 12px; border-radius: 10px; background: var(--panel2); display: flex; gap: 10px; align-items: baseline; }

@media (max-width: 560px) { .vs { grid-template-columns: 1fr; } .vs .mid { padding: 0; } .big { font-size: 1.8rem; } }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn svg { width: 16px; height: 16px; }

.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 11px 14px; border-radius: 11px; background: var(--violet-soft); border: 1px solid color-mix(in srgb, var(--violet) 35%, transparent); }
.banner p { margin: 0; flex: 1 1 260px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--panel-grad), var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 15px 16px; display: flex; flex-direction: column; gap: 5px; min-width: 0; box-shadow: var(--shadow); }
.tile .eyebrow { display: flex; align-items: center; gap: 7px; }

.tile .v { font: 700 2rem/1.1 var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.tile .v small, .big small, .cc-kpi .v small { font-size: .5em; color: var(--muted); font-weight: 600; margin-left: 4px; letter-spacing: 0; }
.cur { font-size: .6em; font-weight: 600; color: var(--muted); margin-right: 3px; vertical-align: .32em; }
.tile .s { font-size: .82rem; color: var(--muted); }
.tile.good .v { color: var(--good); } .tile.warn .v { color: var(--warn); } .tile.bad .v { color: var(--bad); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--panel-grad), var(--panel); border: 1px solid var(--edge); border-radius: 18px; padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.hero { background: var(--hero); border: 1px solid var(--line); border-radius: 22px; padding: 22px 24px; display: flex; flex-wrap: wrap; gap: 18px 32px; justify-content: space-between; align-items: flex-end; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -80px; top: -120px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, var(--glow2), transparent 70%); pointer-events: none; }
.hero .figs { display: flex; gap: 28px; flex-wrap: wrap; position: relative; z-index: 1; }
.big { font: 700 2.5rem/1.05 var(--f-num); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.hero .sub { color: var(--muted); }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.chart { width: 100%; height: 290px; }

.alerts { display: flex; flex-direction: column; gap: 6px; }
.alert { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 11px; align-items: center; padding: 8px 10px 8px 0; border-radius: 9px; background: var(--panel2); cursor: pointer; border: 0; text-align: left; width: 100%; }
.alert .bar { align-self: stretch; border-radius: 0 3px 3px 0; }
.alert.high .bar { background: var(--bad); } .alert.mid .bar { background: var(--warn); } .alert.opp .bar { background: var(--good); }
.alert b { font-weight: 600; }
.alert .t { font-size: .9rem; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: .76rem; font-weight: 700; letter-spacing: .01em; white-space: nowrap; background: var(--panel2); color: var(--muted); border: 1px solid transparent; }
.pill.good { background: var(--good-soft); color: var(--good); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.acc { background: var(--accent-soft); color: var(--accent); } .pill.vio { background: var(--violet-soft); color: var(--violet); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

.tbl-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: .72rem; letter-spacing: .06em; text-transform: none; padding: 9px 10px; background: var(--panel2); position: sticky; top: 0; white-space: nowrap; cursor: pointer; user-select: none; }
th.n, td.n { text-align: right; }
td { padding: 10px 12px; border-top: 1px solid var(--line); white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--accent-soft); }
td.good { color: var(--good); } td.warn { color: var(--warn); } td.bad { color: var(--bad); }
td .nm { font-weight: 600; } td .code { color: var(--muted); font-size: .74rem; margin-left: 6px; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: .76rem; color: var(--muted); font-weight: 500; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; min-width: 0; width: 100%; }
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > .field { flex: 1 1 160px; }

.drop { border: 1.5px dashed var(--line); border-radius: 16px; padding: 34px 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--panel); transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg { width: 38px; height: 38px; color: var(--accent); }
.steps { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.steps span { font-size: .74rem; color: var(--muted); padding: 3px 9px; border-radius: 999px; background: var(--panel2); }

.res { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 11px; border-radius: 9px; background: var(--panel2); }
.res .f { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.acts { display: flex; flex-direction: column; gap: 8px; }
.act { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 10px 12px; border-radius: 10px; background: var(--panel2); border-left: 3px solid var(--c-nkr); }
.act .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; grid-column: 1 / -1; }
.act select { width: auto; padding: 3px 8px; font-size: .78rem; border-radius: 999px; }
.act .tx { min-width: 0; }
.act.Revenue { border-left-color: var(--c-rev); } .act.Product { border-left-color: var(--c-pro); } .act.Hygiene { border-left-color: var(--c-hyg); } .act.Non-revenue { border-left-color: var(--c-nrv); } .act.Non-KRA { border-left-color: var(--c-nkr); }
.day-h { font: 600 .82rem var(--f-display); color: var(--muted); margin-top: 6px; }
.icon-btn { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 4px; border-radius: 6px; display: inline-grid; place-items: center; }
.icon-btn:hover { color: var(--fg); background: var(--panel); }
.icon-btn svg { width: 16px; height: 16px; }

.split { display: flex; flex-direction: column; gap: 8px; }
.split-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 80px; gap: 10px; align-items: center; font-size: .9rem; }
.track { height: 10px; border-radius: 999px; background: var(--panel2); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 999px; }
.seg { display: flex; gap: 4px; background: var(--panel2); padding: 3px; border-radius: 10px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 8px; cursor: pointer; font-size: .8rem; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: var(--shadow); }

.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.kv div { padding: 9px 11px; border-radius: 9px; background: var(--panel2); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kv span { font-size: .78rem; color: var(--muted); }
.kv b { font: 700 1.2rem var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kv b.good { color: var(--good); } .kv b.warn { color: var(--warn); } .kv b.bad { color: var(--bad); }

.empty { padding: 26px 14px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }
.mailbox { min-height: 420px; font: .86rem/1.55 var(--f-mono); }
.cols { columns: 2 280px; column-gap: 16px; font-size: .8rem; }
.cols div { break-inside: avoid; padding: 2px 0; }
.cols b { font-family: var(--f-mono); color: var(--accent); margin-right: 6px; }
.result { font: 700 2.2rem var(--f-num); color: var(--accent); letter-spacing: -.02em; }
.monthnav { display: inline-flex; align-items: center; gap: 4px; padding: 3px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.monthnav b { font: 600 .9rem var(--f-display); min-width: 128px; text-align: center; }
.kra-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
.kra { display: grid; grid-template-columns: 22px minmax(150px, 1.7fr) 112px 80px 60px minmax(140px, 1.3fr) 104px 80px minmax(140px, 1.3fr) 64px; gap: 9px; align-items: start; padding: 12px 12px; border-top: 1px solid var(--line); min-width: 1010px; }
.kra-h { border-top: 0; background: var(--panel2); font-size: .7rem; letter-spacing: .05em; text-transform: none; color: var(--muted); font-weight: 600; padding-block: 9px; border-radius: 14px 14px 0 0; }
.kra .lbl { display: none; font-size: .7rem; color: var(--muted); font-weight: 600; letter-spacing: .03em; text-transform: none; }
.kra > div { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.kra input, .kra select, .kra textarea { padding: 7px 9px; font-size: .9rem; }
.kra textarea { min-height: 0; resize: vertical; }
.kra .k-no { padding-top: 7px; color: var(--muted); }
.kra input[data-f="cat"] { font-weight: 600; }
.kra input:disabled, .kra select:disabled, .kra textarea:disabled { opacity: 1; background: transparent; border-color: transparent; padding-left: 0; color: var(--fg); -webkit-text-fill-color: var(--fg); }
.k-auto { font-size: .78rem; min-height: 1.2em; }
.k-ach { font: 700 1.35rem var(--f-num); letter-spacing: -.01em; } .k-ach.good { color: var(--good); } .k-ach.warn { color: var(--warn); } .k-ach.bad { color: var(--bad); }
.k-pay b { font: 700 1.15rem var(--f-num); padding-top: 2px; }
.k-sm { font-size: .72rem; }
.capbar { position: relative; height: 6px; border-radius: 999px; background: var(--panel2); }
.capbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(90deg, var(--violet), var(--accent)); max-width: 100%; }
.capbar s { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); opacity: .5; text-decoration: none; }
.k-del { align-self: start; margin-top: 4px; }
.appbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 2px 6px; border-bottom: 1px solid var(--edge); margin-bottom: 4px; }
.appbar .crumb { display: flex; align-items: center; gap: 8px; font: 600 .74rem var(--f-display); letter-spacing: .12em; color: var(--muted); text-transform: none; min-width: 0; }
.appbar .crumb b { color: var(--fg); } .appbar .sep { opacity: .4; }
.mark-s { width: 20px; height: 20px; color: var(--fg); display: inline-grid; } .mark-s svg { width: 20px; height: 20px; }

<script>
// ===== Nexora engine: report detection, normalisation, operator matching, metrics, work-log classifier =====
// Pure functions only (no DOM) so the same code runs in the browser and in tests.
var NX = (function () {
  const num = v => { if (v === null || v === undefined || v === '') return null; if (typeof v === 'number') return isFinite(v) ? v : null; const n = parseFloat(String(v).replace(/,/g, '').replace('%', '')); return isFinite(n) ? n : null; };
  const p2 = n => String(n).padStart(2, '0');

    if (v instanceof Date) { v = new Date(Math.round(v.getTime() / 60000) * 60000); if (v.getFullYear() < 1901) return p2(v.getHours()) + ':' + p2(v.getMinutes()); return v.getFullYear() + '-' + p2(v.getMonth() + 1) + '-' + p2(v.getDate()); }

  };
  const has = (h, cols) => cols.every(c => h.has(c.toLowerCase()));
  const pick = (row, ...keys) => { for (const k of keys) { if (row[k] !== undefined && row[k] !== '') return row[k]; } return undefined; };

  // ---------- Report templates (fingerprint = required headers) ----------
  const TEMPLATES = [
    { id: 'kam_bo', name: 'KAM dashboard (operator-wise)', group: 'KAM', req: ['bo_name', 'GMV (In Millions)', 'LQS Score %'] },
    { id: 'kam_one', name: 'KAM dashboard (single operator)', group: 'KAM', req: ['GMV (In Millions)', 'LQS Score %', 'Seat Sold'], not: ['bo_name'] },
    { id: 'route_market', name: 'Route market share', group: 'Routes', req: ['route', 'bo_name', 'Route Sales Share %', 'Market Seat Sold'] },
    { id: 'yb_bo', name: 'YB tracking (operator-wise)', group: 'Hygiene', req: ['vendorid', 'new_boname', 'Assignment %', 'Transaction'] },
    { id: 'yb_service', name: 'YB tracking (service-wise)', group: 'Hygiene', req: ['vendorid', 'serviceid', 'new_yb_service_no', 'Assignment %'] },
    { id: 'service_sales', name: 'Service sales vs route', group: 'Services', req: ['serviceid', 'vendorid', 'seat_sold', 'Route ASP'] },
    { id: 'api_cancel', name: 'API cancellations (BC)', group: 'Hygiene', req: ['bocode_boname', 'API Cancelled txns'] },
    { id: 'service_rd', name: 'Service information (service-wise)', group: 'Services', req: ['vendorid', 'serviceid', 'Liquidation %', 'rB GMV'] },
    { id: 'bo_wise', name: 'Service information (operator-wise)', group: 'Services', req: ['BO Code', 'BO name', '# Active Services', 'Zero Sales'] },
    { id: 'ads_sl', name: 'Red Deal / SL campaigns', group: 'Revenue', req: ['campaign_id', 'bo_id', 'revenue', 'ROAS', 'BDE Name'] },
    { id: 'ads_srp', name: 'SRP ads', group: 'Revenue', req: ['adcampaignid', 'opid', 'cost', 'BDE Name'] },
    { id: 'ads_summary', name: 'Ads summary (targets)', group: 'Revenue', req: ['Target', 'MTD revenue', 'Ach %'] },
    { id: 'kra_summary', name: 'KRA working file (summary)', group: 'KRA', req: ['Category', 'Sub KRA', 'Target', 'Weigh', 'Ach'] },
    { id: 'rider', name: 'Rider route configuration (RT / GD)', group: 'KRA', req: ['BO Code', 'Route', 'RT trip configured', 'GD configured'] },
    { id: 'tam_sl', name: 'TAM pitch tracker (SL / SRP)', group: 'KRA', req: ['BO ID', 'Route', 'TAM', 'Pitched /not pirched'] },
    { id: 'bc_cohort', name: 'Bus cancellation cohort', group: 'KRA', req: ['BO CODE', 'BO NAME', 'Txn', 'Cancellation', 'Reason'] },
    { id: 'rd_trend', name: 'Red Deal monthly trend', group: 'KRA', req: ['operatorid', 'BO Name', 'BDE Name', 'Remarks'] },
  ];

  // find the header row inside the first rows of a sheet (some exports have titles above the header)
  function findHeader(aoa) {
    let best = { idx: 0, score: -1, t: null };
    for (let i = 0; i < Math.min(aoa.length, 40); i++) {
      const h = new Set((aoa[i] || []).map(x => str(x).toLowerCase()).filter(Boolean));
      for (const t of TEMPLATES) {
        if (has(h, t.req) && !(t.not || []).some(c => h.has(c.toLowerCase()))) {
          if (t.req.length > best.score) best = { idx: i, score: t.req.length, t };
        }
      }
      if (best.t) return best;
    }
    return best;
  }

  // aoa = array of arrays from a sheet/CSV. Returns {template, headers, rows} or {template:null, headers}
  function detect(aoa, sheetName) {
    const f = findHeader(aoa);
    const headers = (aoa[f.idx] || []).map(str);
    if (!f.t) return { template: null, headers, rows: [] };

      const r = aoa[i]; if (!r || r.every(c => c === null || c === undefined || str(c) === '')) continue;

      rows.push(o);
    }

    const sn = str(sheetName).toLowerCase();
    if (sn.includes('yesterday')) window = 'Yesterday';
    else if (sn.includes('last 7')) window = 'Last 7 Days';
    if (sn.includes('next')) window += ' (next)';
    if (sn.includes('full')) window = 'Full';
    if (sn.includes('projected')) window = 'Projection' + (sn.includes('next') ? ' (next)' : '');
    return { template: f.t, headers, rows, window, aoa, headerIdx: f.idx };
  }

  // ---------- operator names ----------
  const STOP = new Set(['travels', 'travel', 'tours', 'tour', 'and', 'pvt', 'ltd', 'private', 'limited', 'luxury', 'bus', 'buses', 'transport', 'traansport', 'transports', 'roadways', 'the', 'co', 'services', 'service']);
  function nameKey(n) {
    const t = str(n).toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/).filter(w => w && !STOP.has(w));
    return t.join(' ');
  }

  // ---------- normalise every dataset to a common shape ----------
  // Percentages are stored 0–100 everywhere.
  function pct01(v) { const n = num(v); return n === null ? null : n * 100; }
  function normalise(t, rows, owner, ctx) {
    // Every row is kept; "who is me" is decided later in model(), so region comparisons stay possible.
    const isOwner = () => true;

  function model(allDatasets, thresholds, names) {

      vehicles: kamNow.length ? sum(kamNow, r => r.vehicles) : null, newVehicles: kamNow.length ? sum(kamNow, r => r.newVehicles) : null,

  function dueFrom(text, today) {

    if (/\bnext week\b/.test(t)) { d.setDate(d.getDate() + 7); return iso(d); }
    const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
    for (let i = 0; i < 7; i++) if (t.includes(' ' + days[i])) { const diff = (i - d.getDay() + 7) % 7 || 7; d.setDate(d.getDate() + diff); return iso(d); }

    let best = 'Non-revenue', bs = 0; // unclear lines default to Non-revenue with low confidence
    for (const c of CATS) if (score[c] > bs) { best = c; bs = score[c]; }
    const total = CATS.reduce((s, c) => s + score[c], 0);
    const confidence = bs === 0 ? 'low' : (bs / total >= 0.6 ? 'high' : 'mid');
    // operator: by vendor code or by distinctive first word of the name
    let vid = null;
    const codes = t.match(/\b\d{4,5}\b/g) || [];
    for (const c of codes) if (opsList.some(o => o.vid === c)) { vid = c; break; }

      let bestLen = 0;
      for (const o of opsList) for (const k of o.keys) {
        const words = k.split(' ').filter(x => x.length >= 3);

  function evalExpr(input, unit) {

// ---------- WORK LOG ----------
let logPeriod = 'week', draft = [];
function logRange(p) {
  const t = new Date(); t.setHours(0, 0, 0, 0); const from = new Date(t);
  if (p === 'week') from.setDate(t.getDate() - ((t.getDay() + 6) % 7)); else if (p === 'month') from.setDate(1);
  const f = localISO(from); return S.log.filter(l => l.date >= f && l.date <= TODAY());
}
function opsList() { return [...M.ops.values()]; }
function parseDraft(text) {
  return NX.splitActivities(text).map(t => Object.assign({ text: t }, NX.classify(t, opsList(), S.learned)));
}
function addLogs(text, date, forceVid) {
  const items = parseDraft(text);
  items.forEach(a => S.log.push({ id: Math.random().toString(36).slice(2), text: a.text, date, cat: a.cat, conf: a.confidence, vid: forceVid || a.vid, status: a.status, due: a.due }));
  save(); return items.length;
}
function splitBars(list) {
  if (!list.length) return '<div class="empty">No activities logged in this period.</div>';
  const n = list.length;
  const kra = list.filter(l => l.cat !== 'Non-KRA').length;
  return `<div class="split">${NX.CATS.map(c => { const k = list.filter(l => l.cat === c).length; return `<div class="split-row"><span><span class="dot" style="background:${catVar(c)}"></span> ${c}</span><span class="track"><i style="width:${k / n * 100}%;background:${catVar(c)}"></i></span><span class="mono" style="text-align:right">${k} · ${Math.round(k / n * 100)}%</span></div>`; }).join('')}</div>
    <div class="muted" style="font-size:.8rem">KRA work ${Math.round(kra / n * 100)}% · Non-KRA ${Math.round((n - kra) / n * 100)}%</div>`;
}
function actRow(l) {
  return `<div class="act ${esc(l.cat)}" data-id="${esc(l.id)}"><div class="tx">${esc(l.text)}</div>
    <div><button class="icon-btn star ${l.star ? 'on' : ''}" data-star="${esc(l.id)}" title="${l.star ? 'Key win' : 'Mark as key win for appraisal'}" aria-label="Key win">${I.star}</button><button class="icon-btn" data-done="${esc(l.id)}" title="${l.status === 'Done' ? 'Mark as open' : 'Mark done'}" aria-label="Toggle done">${I.check}</button><button class="icon-btn" data-del="${esc(l.id)}" title="Delete" aria-label="Delete">${I.trash}</button></div>
    <div class="meta"><select data-cat="${esc(l.id)}" aria-label="Category">${NX.CATS.map(c => `<option ${c === l.cat ? 'selected' : ''}>${c}</option>`).join('')}</select>
    ${l.vid ? `<span class="pill acc" data-op="${esc(l.vid)}" style="cursor:pointer">${esc(opName(l.vid))}</span>` : ''}
    <span class="pill ${l.status === 'Done' ? 'good' : 'warn'}">${esc(l.status)}${l.due ? ' · ' + esc(l.due.slice(5)) : ''}</span>
    ${l.conf === 'low' ? '<span class="pill">check tag</span>' : ''}<span class="muted mono" style="font-size:.72rem">${esc(l.date)}</span></div></div>`;
}
function bindActs() {
  document.querySelectorAll('[data-cat]').forEach(s => s.addEventListener('change', e => { const l = S.log.find(x => x.id === e.target.dataset.cat); if (!l) return; l.cat = e.target.value; l.conf = 'high'; NX.learn(S.learned, l.text, l.cat); save(); toast('Saved — Nexora will remember this'); render(); }));
  document.querySelectorAll('[data-done]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const l = S.log.find(x => x.id === b.dataset.done); if (!l) return; l.status = l.status === 'Done' ? 'Follow-up' : 'Done'; save(); render(); }));
  document.querySelectorAll('[data-star]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const l = S.log.find(x => x.id === b.dataset.star); if (!l) return; l.star = !l.star; save(); toast(l.star ? 'Marked as a key win for your appraisal' : 'Removed from key wins'); render(); }));
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); S.log = S.log.filter(x => x.id !== b.dataset.del); save(); render(); }));
}

      ${days.map(d => `<div class="day-h">${new Date(d + 'T00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' })}</div><div class="acts">${S.log.filter(l => l.date === d).map(actRow).join('')}</div>`).join('') || '<div class="empty">Your first entry will appear here.</div>'}

// ---------- SAVE A FILE (downloads capability) ----------
async function saveFile(filename, data) {
  let d = null;
  try { d = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { d = null; }
  if (!d) return saveLocal(filename, data);
  try { await d.save({ filename, data }); toast('Saved ' + filename); return true; }
  catch (e) { if (e && e.code === 'declined') return false; toast('Could not save: ' + ((e && (e.message || e.code)) || 'unknown')); return false; }
}

// Outside Claude: the Android app shares the file (Drive, WhatsApp, Files); the website downloads it.
async function saveLocal(filename, data) {
  const blob = data instanceof Blob ? data : new Blob([data]);
  const cap = window.Capacitor;
  if (cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins && cap.Plugins.Filesystem) {
    try {
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
      const w = await cap.Plugins.Filesystem.writeFile({ path: filename, data: b64, directory: 'CACHE' });
      if (cap.Plugins.Share) await cap.Plugins.Share.share({ title: filename, url: w.uri, dialogTitle: 'Save or send ' + filename });
      toast('Ready: ' + filename); return true;
    } catch (e) { if (!/cancel/i.test(String(e && e.message))) toast('Could not save: ' + (e && e.message)); return false; }
  }
  try { const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); toast('Downloaded ' + filename); return true; }
  catch (e) { toast('Could not save: ' + e.message); return false; }
}

    sb.auth.onAuthStateChange((_e, s) => { SY.user = s ? s.user : null; if (!SY.user) SY.state = 'local'; syncBadge(); });
    if (SY.user) await cloudPull(true);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && SY.user) cloudPull(); });
    try { sb.from('nexora_ping').select('id').limit(1).then(() => { }); } catch (e) { }
  } catch (e) { SY.state = 'error'; SY.err = e.message; }
  syncBadge();
}
async function cloudPull(first) {
  if (!sb || !SY.user || SY.busy) return; SY.busy = true; SY.state = 'syncing'; syncBadge();
  try {
    const { data, error } = await sb.storage.from('nexora').download(cloudPath() + '?t=' + Date.now());
    if (error) {
      if (/not.?found|object not found|400|404/i.test(error.message || '') || error.statusCode === '404') { SY.busy = false; if (!S.demo) await cloudPush(); else { SY.state = 'synced'; } syncBadge(); return; }
      throw error;
    }
    const remote = JSON.parse(await gunz(data));
    if (S.demo || (remote.savedAt || 0) > (S.savedAt || 0)) {
      S = Object.assign({}, S, remote); S.demo = false; rebuild(); await DB.set('state', S); SY.last = Date.now(); SY.state = 'synced';
      if (!first) toast('Updated from your other device'); render();
    } else if ((S.savedAt || 0) > (remote.savedAt || 0)) { SY.busy = false; await cloudPush(); return; }
    else { SY.state = 'synced'; SY.last = Date.now(); }
  } catch (e) { SY.state = 'error'; SY.err = e.message || String(e); }
  SY.busy = false; syncBadge();
}
let pushTimer = null;
function schedulePush() { if (!sb || !SY.user || S.demo) return; clearTimeout(pushTimer); pushTimer = setTimeout(cloudPush, 3000); }
async function cloudPush() {
  if (!sb || !SY.user || S.demo) return; if (SY.busy) { schedulePush(); return; }
  SY.busy = true; SY.state = 'syncing'; syncBadge();
  try {
    const blob = await gz(JSON.stringify(S));
    const { error } = await sb.storage.from('nexora').upload(cloudPath(), blob, { upsert: true, contentType: 'application/gzip', cacheControl: '0' });
    if (error) throw error;
    SY.state = 'synced'; SY.last = Date.now();
  } catch (e) { SY.state = 'error'; SY.err = e.message || String(e); }
  SY.busy = false; syncBadge();
}
function cloudCard() {
  if (!cloudOn()) return `<section class="card"><h2>Cloud sync</h2><p class="muted" style="margin:0">Sync between phone and laptop works in the Nexora website and Android app. This preview keeps data in this browser only.</p></section>`;
  if (!SY.user) return `<section class="card"><div class="card-h"><h2>Cloud sync</h2><span class="pill">Off</span></div>
    <p class="muted" style="margin:0">Sign in with the same email and password on your phone and laptop. Your data goes to your own private Supabase storage and only this login can read it.</p>
    <div class="row"><div class="field"><label for="sy-e">Email</label><input type="text" id="sy-e" autocomplete="username" inputmode="email"></div><div class="field"><label for="sy-p">Password</label><input type="password" id="sy-p" autocomplete="current-password" style="background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%"></div></div>
    <div class="actions"><button class="btn primary" id="sy-in">Sign in</button><button class="btn" id="sy-up">Create account (first time)</button></div><p class="muted" id="sy-msg" style="margin:0;font-size:var(--t-cap)"></p></section>`;
  return `<section class="card"><div class="card-h"><h2>Cloud sync</h2><span class="pill ${SY.state === 'error' ? 'bad' : 'good'}">${SY.state === 'error' ? 'Error' : 'On'}</span></div>
    <div class="kv"><div><span>Signed in as</span><b style="font-size:1rem">${esc(SY.user.email || '')}</b></div><div><span>Last synced</span><b style="font-size:1rem">${SY.last ? new Date(SY.last).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '–'}</b></div></div>
    ${SY.state === 'error' ? `<p class="muted" style="margin:0;color:var(--bad)">${esc(SY.err)}</p>` : ''}
    <div class="actions"><button class="btn primary" id="sy-now">Sync now</button><button class="btn" id="sy-out">Sign out</button></div>
    <p class="muted" style="margin:0;font-size:var(--t-cap)">Changes upload a few seconds after you make them and download when you open the app. If both devices change at once, the later save wins.</p></section>`;
}
function bindCloud() {
  const msg = t => { const m = $('#sy-msg'); if (m) m.textContent = t; };
  const go = async up => {
    const email = ($('#sy-e').value || '').trim(), password = $('#sy-p').value || '';
    if (!email || password.length < 6) return msg('Enter your email and a password of at least 6 characters.');
    msg(up ? 'Creating your account…' : 'Signing in…');
    const r = up ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
    if (r.error) return msg(r.error.message);
    SY.user = (r.data && (r.data.user || (r.data.session && r.data.session.user))) || null;
    if (!SY.user || !r.data.session) return msg('Account created. Check your email to confirm, then sign in.');
    toast('Signed in — syncing'); await cloudPull(true); render();
  };
  const i = $('#sy-in'); if (i) i.addEventListener('click', () => go(false));
  const u = $('#sy-up'); if (u) u.addEventListener('click', () => go(true));
  const n = $('#sy-now'); if (n) n.addEventListener('click', async () => { await cloudPull(); render(); });
  const o = $('#sy-out'); if (o) o.addEventListener('click', async () => { await sb.auth.signOut(); SY.user = null; SY.state = 'local'; render(); toast('Signed out — data stays on this device'); });
}

// ---------- UPLOAD ----------
let lastResults = [];
function vUpload() {
  const byT = {}; S.datasets.filter(d => !d.demo).forEach(d => { const k = d.t; byT[k] = byT[k] || []; byT[k].push(d); });
  return head('Upload data', { eyebrow: 'Zero-touch import', text: 'Drop any of your Superset / Sheets exports. Nexora recognises each report, cleans it and updates every screen.' }) +
    `<label class="drop" id="drop" for="file"><span>${I.up}</span><h2>Drop CSV or Excel files here</h2><span class="muted">or tap to choose · several at once is fine · up to ~40k rows each</span>
      <span class="steps"><span>Detect report</span><span>Map columns</span><span>Clean</span><span>Pick your rows</span><span>Calculate</span><span>Refresh</span></span></label>
    <div id="results" class="acts">${lastResults.map(resRow).join('')}</div>
    <section class="card"><h2>Reports Nexora recognises</h2><div class="tbl-wrap"><table><thead><tr><th>Report</th><th>Area</th><th>Last upload</th><th class="n">Rows</th></tr></thead><tbody>
      ${NX.TEMPLATES.filter(t => t.id !== 'ads_summary' && t.id !== 'kam_one').map(t => { const d = (byT[t.id] || []).sort((a, b) => b.at - a.at)[0]; return `<tr><td>${t.name}</td><td>${t.group}</td><td class="mono">${d ? new Date(d.at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '<span class="muted">not yet</span>'}</td><td class="n">${d ? fmt((byT[t.id] || []).reduce((s, x) => s + x.rows.length, 0)) : '–'}</td></tr>`; }).join('')}
    </tbody></table></div><p class="muted" style="margin:0;font-size:.8rem">Re-uploading the same report replaces the older copy. Files are read on this device; nothing is sent anywhere.</p></section>`;
}
function resRow(r) { return `<div class="res"><span class="pill ${r.ok ? 'good' : r.skip ? '' : 'bad'}">${r.ok ? 'Loaded' : r.skip ? 'Skipped' : 'Unknown'}</span><span style="min-width:0"><b>${esc(r.label)}</b><div class="f">${esc(r.file)}${r.sheet ? ' · ' + esc(r.sheet) : ''}</div></span><span class="mono muted">${r.ok ? fmt(r.rows) + ' rows' : ''}</span></div>`; }
afterRender.upload = () => {
  const dz = $('#drop');
  ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop', e => handleFiles([...e.dataTransfer.files]));
};
$('#file').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; handleFiles(fs); });
async function handleFiles(files) {
  if (!files || !files.length) return;
  if (VIEW !== 'upload') go('upload');
  const res = $('#results'); if (res) res.innerHTML = `<div class="res"><span class="pill acc">Working</span><span>Reading ${files.length} file${files.length > 1 ? 's' : ''}…</span><span></span></div>`;
  const out = [], fresh = [], kraImports = [];
  for (const f of files) {
    try {
      const buf = await f.arrayBuffer(); const isCsv = /\.csv$/i.test(f.name);
      const wb = XLSX.read(buf, { type: 'array', cellDates: true, raw: isCsv, dense: false });
      for (const sn of wb.SheetNames) {
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: null });
        if (!aoa.length) continue;
        const d = NX.detect(aoa, sn);
        if (!d.template) { out.push({ ok: false, label: 'Not recognised yet', file: f.name, sheet: wb.SheetNames.length > 1 ? sn : '' }); continue; }
        if (d.template.id === 'ads_summary' || /full|projection/i.test(d.window)) { out.push({ ok: false, skip: true, label: d.template.name + (d.window ? ' · ' + d.window : '') + ' — not needed, totals are calculated from raw rows', file: f.name, sheet: sn }); continue; }
        if (d.template.id === 'kra_summary') { const rs = NX.normalise('kra_summary', d.rows, S.settings.owner, d); kraImports.push([rs, f.name]); continue; }
        const rows = NX.normalise(d.template.id, d.rows, S.settings.owner, d);
        fresh.push({ id: d.template.id + '|' + d.window + '|' + Date.now() + Math.random(), t: d.template.id, window: d.window, rows, file: f.name, sheet: sn, at: Date.now() });
        out.push({ ok: true, label: d.template.name + (d.window && d.window !== 'MTD' ? ' · ' + d.window : ''), file: f.name, sheet: wb.SheetNames.length > 1 ? sn : '', rows: rows.length });
      }
    } catch (e) { out.push({ ok: false, label: 'Could not read this file (' + e.message + ')', file: f.name }); }
  }
  if (fresh.length || kraImports.length) {
    if (S.demo) { if (S.kra) for (const k of Object.keys(S.kra)) if (S.kra[k].demo) delete S.kra[k]; S.snap = {}; S.weekly = {}; }
    for (const [rs, fn] of kraImports) out.push(Object.assign({ file: fn }, importKra(rs, fn)));
  }
  if (fresh.length || kraImports.length) {
    if (S.demo) { S.datasets = []; S.log = S.log.filter(l => !l.demo); S.demo = false; }
    for (const d of fresh) { const mo = x => (x.t === 'kam_bo' || x.t === 'route_market') && x.rows[0] ? x.rows[0].month : ''; S.datasets = S.datasets.filter(x => !(x.t === d.t && (x.window || 'MTD') === (d.window || 'MTD') && mo(x) === mo(d))); S.datasets.push(d); }
    rebuild(); save();
  }
  lastResults = out; render();
  const n = out.filter(r => r.ok).length; if (n) toast(`${n} report${n > 1 ? 's' : ''} loaded · all screens updated`);
}

  const T = S.settings.T;

      ${confirmReset ? `<div class="confirm"><b>Clear all uploaded data and work log?</b><span class="muted">This cannot be undone.</span><button class="btn danger" id="resetyes">Yes, clear everything</button><button class="btn" id="resetno">Keep</button></div>` : `<div class="actions"><button class="btn danger" id="reset">${I.trash}Clear all data</button><button class="btn" id="demo">Load demo data</button></div>`}
      <p class="muted" style="margin:0;font-size:.8rem">This preview keeps everything in this browser on this device. The cloud version (Supabase) will sync phone and laptop.</p>
    </section>`;
}
afterRender.settings = () => {
  bindCloud();
  $('#owner').addEventListener('change', e => { S.settings.owner = e.target.value.trim() || 'Suresh'; save(); toast('Saved'); });
  $('#names').addEventListener('change', e => { S.settings.names = e.target.value; rebuild(); save(); render(); toast('Your rows re-selected'); });

  $('#mask').addEventListener('click', () => { S.settings.mask = !S.settings.mask; save(); render(); });
  document.querySelectorAll('[data-t]').forEach(i => i.addEventListener('change', e => { const v = parseFloat(e.target.value); if (!isNaN(v)) { S.settings.T[e.target.dataset.t] = v; rebuild(); save(); toast('Threshold saved'); } }));
  $('#tdef').addEventListener('click', () => { S.settings.T = Object.assign({}, DEF_T); rebuild(); save(); render(); });
  document.querySelectorAll('[data-rmds]').forEach(b => b.addEventListener('click', () => { S.datasets = S.datasets.filter(d => d.id !== b.dataset.rmds); rebuild(); save(); render(); }));

  const n = $('#resetno'); if (n) n.addEventListener('click', () => { confirmReset = false; render(); });
  const dm = $('#demo'); if (dm) dm.addEventListener('click', () => { loadDemo(); render(); });
};

function loadDemo() {
  const d = demoData(); S.datasets = d.datasets; S.demo = true; rebuild();
  S.log = d.logs.map(l => { const c = NX.classify(l.text, opsList(), S.learned); return { id: Math.random().toString(36).slice(2), text: l.text, date: l.date, cat: c.cat, conf: c.confidence, vid: c.vid, status: c.status, due: c.due, demo: true }; });
  const cm = curMonth();
  S.kra = { [cm]: { status: 'draft', demo: true, mgrOverall: null, items: [
    newKraItem({ cat: 'Revenue', sub: 'SL + SRP ads revenue for the month', unit: '₹', target: 800000, weight: 15, source: 'sl_srp', remarks: 'Pipeline 3L Kaveri, 1.5L Marina' }),
    newKraItem({ cat: 'Red Deal', sub: 'Red Deal seat share across portfolio', unit: '%', target: 40, weight: 15, source: 'red_deal' }),

    newKraItem({ cat: 'NOVA', sub: 'NOVA units sold (DMS, Alcobrake, FDSS)', unit: '#', target: 25, weight: 10, input: '=30+30', remarks: 'Capped at 200%' }),
    newKraItem({ cat: 'KAM metrics', sub: 'JBP closures (2 sign-ups)', unit: '#', target: 2, weight: 10, input: '1', remarks: 'Second JBP pending sign-off' }),
    newKraItem({ cat: 'Hygiene', sub: 'YB assignment %', unit: '%', target: 90, weight: 15, source: 'yb' }),
    newKraItem({ cat: 'Quality', sub: 'LQS score %', unit: '%', target: 75, weight: 15, source: 'lqs' }),
  ] } };
  // fictional history so Appraisal and trends have something to show
  const base = S.kra[cm].items, fac = [0.82, 0.9, 0.97, 1.06, 1.12, 0.94, 1.03];

    S.kra[m] = { status: 'final', demo: true, finalAt: Date.now(), mgrOverall: null, items };
    items.forEach(it => { const c = kraRowCalc(it, {}); it.final = { actual: c.actual, ach: c.ach, raw: c.raw, payout: c.payout, gap: c.gap }; it.mgrAch = c.ach === null ? null : Math.max(0, Math.round(c.ach - 4)); });

  const pool = ['Closed Red Deal renewal with Kaveri Express for festival week', 'Fixed YB GPS assignment for Nilgiri Roadlines buses', 'Onboarded 6 Vaigai Travels services to Primo', 'Visited Marina Travels owner for JBP review', 'Pricing discussion with Thamarai Tours on Chennai-Madurai', 'Resolved bus cancellation complaints for Coromandel Coaches', 'Prepared monthly MIS report for manager', 'Trained Kaveri Express team on new seat layout feature', 'Activated SRP ad for Marina Travels on Chennai-Trichy', 'Helped regional team with Diwali campaign planning', 'Updated vehicle images and rest stop config for Vaigai Travels', 'Signed JBP with Nilgiri Roadlines'];
  const extra = []; for (let i = 1; i <= 6; i++) for (let k = 0; k < 6; k++) { const d = new Date(shiftMonth(cm, -i) + '-01T00:00'); d.setDate(3 + k * 4); const t = pool[(i * 5 + k) % pool.length]; const c = NX.classify(t, opsList(), S.learned); extra.push({ id: Math.random().toString(36).slice(2), text: t, date: localISO(d), cat: c.cat, conf: c.confidence, vid: c.vid, status: 'Done', due: null, demo: true, star: /closed|signed|onboarded/i.test(t) && k % 2 === 0 }); }
  S.log = S.log.concat(extra);

}
(async function boot() {
  const saved = await DB.get('state');
  if (saved && saved.datasets) { S = Object.assign(S, saved); S.settings = Object.assign({ owner: 'Suresh', names: 'Suresh, Suresh Krishnan S', mask: false, kraCap: 200 }, saved.settings); S.kra = S.kra || {}; S.notes = S.notes || {}; S.snap = S.snap || {}; S.weekly = S.weekly || {}; S.appraisal = S.appraisal || {}; S.settings.T = Object.assign({}, DEF_T, saved.settings && saved.settings.T); rebuild(); }

})();
