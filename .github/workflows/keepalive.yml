name: Keep cloud awake
# Supabase free projects pause after a week without activity. A tiny read every day keeps Nexora's sync online.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/keepalive.yml"]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o out.txt -w "%{http_code}" "https://qcamnrymnnxkypuwcpmd.supabase.co/rest/v1/nexora_ping?select=id" -H "apikey: sb_publishable_p1a5Wnw6zvXmsfUPOyQk3Q_IAHWBPcF")
          echo "HTTP $code"; cat out.txt; echo
          [ "$code" = "200" ]
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://qcamnrymnnxkypuwcpmd.supabase.co/auth/v1/settings" -H "apikey: sb_publishable_p1a5Wnw6zvXmsfUPOyQk3Q_IAHWBPcF")
          echo "auth HTTP $code"; [ "$code" = "200" ]
          curl -s "https://qcamnrymnnxkypuwcpmd.supabase.co/auth/v1/settings" -H "apikey: sb_publishable_p1a5Wnw6zvXmsfUPOyQk3Q_IAHWBPcF" | python3 -c "import sys,json; d=json.load(sys.stdin); print('email signup on:', d['external'].get('email'), '| confirm email off:', d.get('mailer_autoconfirm'))"
