name: Keep cloud awake
# Supabase free projects pause after a week without activity. A tiny read every day keeps Nexora's sync online.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/keepalive.yml"]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: https://qcamnrymnnxkypuwcpmd.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjYW1ucnltbm54a3lwdXdjcG1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MzMwNzMsImV4cCI6MjEwODQwOTA3M30.Wt-kv6vRPA_CE6rJyQJq0GMVnd77p56b6JZ6q6yTWKU
        run: |
          code=$(curl -s -o out.txt -w "%{http_code}" "$URL/rest/v1/nexora_ping?select=id" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "rest HTTP $code"; cat out.txt; echo
          [ "$code" = "200" ]
          curl -s "$URL/auth/v1/settings" -H "apikey: $KEY" | python3 -c "import sys,json; d=json.load(sys.stdin); print('email provider on:', d['external'].get('email'), '| auto-confirm (confirm email OFF):', d.get('mailer_autoconfirm'))"
