name: Build Nexora (website + APK)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: nexora, cancel-in-progress: true }
jobs:
  website:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0B1020' --splashBackgroundColor '#0B1020' || true
      - run: npx cap sync android
      - name: Version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build APK (release-signed when the key password secret is set)
        env:
          KEY_PASS: ${{ secrets.NEXORA_KEY_PASS }}
        run: |
          cd android && chmod +x gradlew
          if [ -n "$KEY_PASS" ]; then
            ./gradlew assembleRelease --no-daemon
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk ../aligned.apk
            $BT/apksigner sign --ks ../signing/nexora-release.p12 --ks-type PKCS12 --ks-key-alias nexora --ks-pass env:KEY_PASS --key-pass env:KEY_PASS --out ../Nexora-1.0.${{ github.run_number }}.apk ../aligned.apk
            $BT/apksigner verify --print-certs ../Nexora-1.0.${{ github.run_number }}.apk | head -3
          else
            echo "::warning::NEXORA_KEY_PASS secret not set - building a debug APK"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Nexora-1.0.${{ github.run_number }}.apk
          fi
      - uses: actions/upload-artifact@v4
        with: { name: Nexora-apk, path: "Nexora-*.apk" }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nexora 1.0.${{ github.run_number }}
          body: Install this APK on your phone (allow "install unknown apps" once). Website updates at the same time.
          files: "Nexora-*.apk"
          make_latest: true
